y from any location worldwide'. 'For US-based candidates…' and 'US-based candidates: $35/hour' qualify one group of hires; they do not lock the job to the US.", "data": "filters/remote.classify", "dur": 3.0}, {"node": "auth", "via": ["remote>auth"], "packet": "refuses sponsorship", "role": "guard", "title": "No visa sponsorship - and no visa needed", "text": "The posting says it cannot sponsor visas. Work done from anywhere needs no visa, so only a citizens-only or clearance rule would close it.", "data": "pipeline.route", "dur": 3.0}, {"node": "verdict", "via": ["auth>verdict"], "packet": "route: remote", "role": "store", "title": "Open to you from Pakistan", "text": "Green badge on the Jobs page: 'Remote, open to you'. Small contract, hourly pay.", "data": "jobradar_link.route_kind", "dur": 3.0}], "post": "How a job crawler decides whether one posting is open to you - field by field.\n\nPosting: 'AI Tutor - Croatian' (xAI). It says 'remotely from any location worldwide' and also 'we are unable to provide visa sponsorship'.\nOld rule: no sponsorship → closed. New rule: work open worldwide needs no visa, so only a citizenship or clearance rule closes it. 'For US-based candidates…' qualifies a group of hires; it doesn't lock the job to the US.\n18 such roles came back.\n#AI #Jobs #RegEx"}</script>
