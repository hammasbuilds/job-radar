<html><head><script data-testid="job-ldjson" type="application/ld+json" async="">{"@context":"https://schema.org/","@type":"JobPosting","title":"AI Engineer - AI Agents (Healthcare)","description":"<section><div> <span>We’re looking for an </span><b>AI Engineer</b><span> to help us design, evaluate, and scale our next generation of LLM-powered agents. This role is deeply technical, but also product and customer-oriented: you’ll build datasets, run evaluations, improve model performance, and ensure our agents deliver real value in real workflows. </span> </div> <div><br></div> <div><span>As an AI Engineer, you’ll work across Engineering, Product, and Customer teams to continuously improve our agent quality, reliability, and speed. You won’t just build agents — you’ll build the systems, metrics, and feedback loops that make those agents better over time.</span></div></section><section><h3>Responsibilities</h3> <ul> <li>Build, curate, and maintain agentic workflows along with datasets for training and evaluation. </li> <li>Run systematic LLM evaluations, track regressions, and ensure models meet quality bars.</li> <li>Define and implement LLM performance metrics(e.g., correctness, latency, hallucination control, safety). </li> <li>Work closely with Product and Customer-facing teams, experiment with prompting techniques, fine-tuning datasets, retrieval strategies, and model configurations and ensure agent behaviour aligns with user expectations. </li> <li>Develop internal tooling to speed up evaluation, annotation, and iteration cycles. </li> <li>Build automated pipelines for regression checks and model monitoring. </li> <li>Create mechanisms that turn real user interactions into actionable model improvements. </li> <li>Ensure agents behave consistently across large-scale production scenarios. </li> <li>Debug complex system behaviours spanning prompts, tools, APIs, and model responses.</li> <li>To understand real-world use cases and failure modes. Translate customer insights into model needs, data requirements, and product improvements. </li> <li>Tune latency, turn-taking, and conversational naturalness for voice AI systems. </li> <li>Write clean, reliable code in Python or JS for model pipelines, tools, and integrations. </li> <li>Think in systems: from data ingestion to model outputs to user-facing behaviour.</li> </ul></section><section><h3>Success Looks Like</h3> <ul> <li>Strong evaluation coverage with clear, actionable metrics.</li> <li>Faster iteration cycles due to improved internal tools and workflows.</li> <li>Measurable improvement in agent accuracy, consistency, and safety. </li> <li>Reliable agent performance in production — fewer escalations, fewer regressions.</li> <li>Clear alignment between customer needs and agent capabilities.</li> <li>Smooth collaboration across engineering, product, and customer teams.</li> </ul></section><section><h3>What We’re Looking For</h3> <ul> <li> <b>2–5 years</b> experience in software engineering, with strong fundamentals in building reliable, scalable systems.<b>1–2 years </b>of experience working on AI-backed products(LLM engineering, evaluations, prompting, or agent development).</li> <li>Hands-on experience with LLMs, prompt engineering, evaluation frameworks, or dataset creation.</li> <li>Strong understanding of how LLMs work: prompting, fine-tuning, evaluation, guardrails, and system design.</li> <li>Solid software engineering skills and comfort with APIs and cloud environments.</li> <li>Experience building internal tools or automation pipelines.</li> <li>Ability to think from the customer backward: empathetic, detail-oriented, and outcome-driven.</li> <li>Excellent communicator who collaborates well across cross-functional teams.</li> <li>Fast learner who loves turning cutting-edge research into practical, dependable systems.</li> <li>Bonus: experience with voice AI, speech technologies, or real-time agent systems.</li> </ul></section><section><h3>Why This Role Matters</h3> <u
